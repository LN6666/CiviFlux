name: Bug report
description: Reproduce a CiviFlux engineering or analysis defect
body:
  - type: textarea
    attributes:
      label: Reproduction
      description: Commit, OS, command, observed result and expected result. Remove keys and private data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence
      description: Attach redacted logs and run/export hashes. State synthetic/current/historical data scope.
  - type: textarea
    attributes:
      label: Affected boundary
      description: Data mapping, physical simulation, ontology, policy, ranking, API or UI.
