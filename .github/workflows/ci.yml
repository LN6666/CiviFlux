name: CiviFlux checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: python -m pip install uv==0.11.23
      - run: make bootstrap
      - run: make test-fast test-data test-outcomes test-sumo security-check sbom-host-check
      - run: make build-web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make test-browser
        env:
          CIVIFLUX_TOY_ONLY: '1'
          QWEN_API_ALLOW_EGRESS: '0'
          QWEN_API_MAX_CALLS: '0'
          SIMPLEJEV_ALLOW_EGRESS: '0'
          SIMPLEJEV_MAX_CALLS: '0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: web/test-results/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        if: always()
        with:
          name: linux-sbom-evidence
          path: .runtime/sbom-host/
  # Live API and live data acquisition are explicit local/manual gates; CI has no API credentials.
