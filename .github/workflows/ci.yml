name: CiviFlux checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.11.23
      - run: make bootstrap
      - run: make test-fast test-data test-outcomes test-sumo security-check
      - run: make build-web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make test-browser
        env:
          CIVIFLUX_TOY_ONLY: '1'
          QWEN_API_ALLOW_EGRESS: '0'
          QWEN_API_MAX_CALLS: '0'
          SIMPLEJEV_ALLOW_EGRESS: '0'
          SIMPLEJEV_MAX_CALLS: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: web/test-results/
  # Live API and live data acquisition are explicit local/manual gates; CI has no API credentials.
