version: 1.2-qwen-api
execution:
  backend: local
  max_parallel_jobs: 1
  max_job_wall_seconds: 900
  max_output_mb: 512
network:
  mandatory_facilities_check: true
  metric_crs: EPSG:3067
  source_geometry_crs: EPSG:4326
  assume_missing_speed: false
  boundary_stability_required: true
ranking:
  default: A2
  alpha: 0.85
  epsilon: 0.1
  normalization: relation_mixture
  max_iter: 500
  residual_l1: 1.0e-08
  identical_pair_seeds: true
  identical_pair_policy: true
  preserve_restricted_asset_nodes: true
system_one:
  enabled: false
  backend: qwen_openai_compatible
  base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  model: qwen3.7-plus-2026-05-26
  allow_egress: false
  max_calls: 0
  max_output_tokens: 512
  calibration_status: NOT_CALIBRATED
  score_semantics: api_generated_semantic_relevance_not_calibrated_probability
  send_coordinates: false
  send_raw_graph: false
  live_verification: DEFERRED_USER
llm:
  enabled: false
  provider: null
  model: null
  may_edit_physical_metrics: false
fire:
  auto_cordon_radius: null
  require_operator_restrictions: true
  output_fire_spread: false
  operational_dispatch: false
