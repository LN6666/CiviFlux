services:
  civiflux:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    environment:
      CIVIFLUX_WORKSPACE: /workspace
      SIMPLEJEV_ALLOW_EGRESS: '0'
      SIMPLEJEV_MAX_CALLS: '0'
      QWEN_API_ALLOW_EGRESS: '0'
      QWEN_API_MAX_CALLS: '0'
    volumes:
      - ../.runtime/container:/workspace
      - ../data/citypacks:/app/data/citypacks:ro
    # Linux host networking keeps the API loopback-only. macOS: use make demo-local.
